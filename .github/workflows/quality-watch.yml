name: Quality watch

# Nightly lab measurement + responsive matrix. Both read production, write
# nothing, and create no fixtures — which is why they are the only e2e-derived
# checks allowed to run on a timer (the functional suite writes to the live
# merchant database and stays manual, see ci.yml's e2e-readiness job).
#
# A red run here opens a task; it does not page anyone.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC = 05:00 Asia/Bahrain

permissions:
  contents: read

jobs:
  responsive:
    name: Responsive matrix (6 viewports × 8 public routes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The config pins channel=chrome for the operator's machine; CI uses the
      # bundled Chromium so the runner does not depend on a preinstalled Chrome.
      - run: npx playwright install --with-deps chromium
      - name: Responsive matrix
        run: npx playwright test --project=responsive
        env:
          PW_CHANNEL: chromium
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://dokanstore.xyz' }}
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-failures
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Core Web Vitals (mobile 360, 4× CPU, 1.6 Mbps)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Lighthouse CI
        run: npm run lighthouse
        env:
          LH_BASE_URL: ${{ vars.LH_BASE_URL || 'https://dokanstore.xyz' }}
          LH_RUNS: 3
          # chrome-launcher finds Google Chrome on ubuntu-latest; pin it so a
          # runner image change fails loudly here instead of picking a random
          # Chromium build with different throttling.
          CHROME_PATH: /usr/bin/google-chrome

  # Wave 6 — iOS. The only gate that runs WebKit; Chromium cannot see Safari's
  # collapsing toolbar, the 16px zoom rule, or dvh behaviour. Public routes
  # only, read-only, so it belongs on the nightly timer.
  webkit:
    name: iOS smoke (WebKit, iPhone 13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: WebKit smoke
        run: npm run test:webkit
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://dokanstore.xyz' }}

  # Wave 6 — merchant responsive matrix. This job CREATES a fixture merchant
  # (user + store + products + tables) and deletes it in afterAll, which means it
  # writes to whatever database the secrets point at. That is why it is
  # workflow_dispatch ONLY and never scheduled: a nightly writer into production
  # is how one bad run leaves a real tenant behind. Requires the three Supabase
  # secrets; if they are absent the job fails with an instruction, not silently.
  authed-matrix:
    name: Merchant matrix (8 screens × 5 widths)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Write the e2e env file
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.E2E_BASE_URL || 'https://dokanstore.xyz' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_ROLE" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets are not set."
            echo "This job writes a temporary merchant, so it needs real credentials."
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE"
            echo "NEXT_PUBLIC_SITE_URL=$SITE_URL"
          } > .env.local
      - name: Merchant matrix
        run: npm run test:authed
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://dokanstore.xyz' }}
          PW_CHANNEL: chromium
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authed-matrix-failures
          path: test-results/
          retention-days: 7

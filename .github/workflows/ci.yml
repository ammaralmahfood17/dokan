name: CI

# Why this exists: the Dokan repo auto-deploys `master` straight to Vercel, and until
# 2026-09-26 there was NO automated verification at all — a broken commit shipped
# to production silently. This is the gate that prevents a repeat.
#
# Safety rule that shapes this file: the Playwright suite is NOT run here.
# e2e/helpers.ts targets dokanstore.xyz (production) by default and creates
# real users, real projects and real orders before cleaning up. Running it
# automatically on every push would write into the live merchant's database.
# E2E stays a manual, deliberate step (see the comment in `e2e/README`).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Never let two runs compete for the same deploy preview.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-security:
    name: Fresh database · Security assertions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply every migration from zero
        run: supabase db reset

      # A migration waiting for approval lives in supabase/pending/ (invisible to the app that
      # deploys to production). Apply those here, on the throwaway database, so the owner can be
      # told the file passed CI from zero before being asked to approve it. psql talks to the
      # stack `supabase start` just brought up; the local connection string is the CLI's default.
      - name: Apply the pending (not yet approved) migrations
        run: |
          shopt -s nullglob
          files=(supabase/pending/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no pending migrations"
            exit 0
          fi
          command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client
          for f in "${files[@]}"; do
            echo "::group::applying $f"
            PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Run database security tests
        run: supabase test db

  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22, not 20: @supabase/supabase-js constructs a Realtime client
          # at createClient() time and throws "Node.js detected but native
          # WebSocket not found" on Node 20. This is why the first two CI runs
          # failed in the e2e job while passing locally (local Node is 26).
          node-version: 22
          # npm ci (not npm install) so the lockfile is authoritative — this is
          # the same fix applied to vercel.json.
          cache: 'npm'

      - name: Install (npm ci)
        run: npm ci

      - name: Verify environment contract
        run: npm run env:check

      # Placeholder env for the build only. No real secret is needed and none is
      # exposed: `NEXT_PUBLIC_*` values are inlined at build time, so the build
      # must be given *something*, but nothing here reaches production. The
      # service-role check below passes on the literal string `sbp_`-free value.
      # Real deployment env lives in Vercel, never in the repo.
      - name: Write build-time env placeholders
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SITE_URL=https://dokanstore.xyz
          NEXT_PUBLIC_SUPABASE_URL=https://ci-supabase.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY=ci-service-role-key-do-not-bundle
          EOF

      - name: Validate deployment environment shape
        run: npm run env:validate

      # The three gates the project already used manually. `lint` runs with
      # --max-warnings 0, so a new warning fails the build.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Audit T2 #1/#3 (W2-T8): the two worst backend findings were the SAME class - a public
      # route using createAdminClient() (RLS bypassed) with a guessable authorisation. Nothing
      # in the build could have noticed a new one. This fails on a service-role route without a
      # documented gate, and on an allow-list entry that has gone stale.
      - name: Assert every service-role route has a documented gate
        run: node scripts/check-public-write-gates.mjs

      # Audit T1 #7 (W3-T6): an icon-only control under 44px is the one a cashier misses
      # mid-rush. Cheap grep-level check, so it can afford to run on every push.
      - name: Assert icon-only controls are at least 44px
        run: node scripts/check-touch-targets.mjs

      # 2026-10-16 (F-12/F-13): `outline-none` on a focusable control removes the only indicator
      # that survives forced-colors mode. It was on the orders date filter and the POS quantity
      # field, invisible until someone tabbed through those exact controls.
      - name: Assert no control drops its focus outline without a substitute
        run: node scripts/check-focus-visible.mjs

      # 2026-10 follow-up: the build used to fetch the font from Google at BUILD time, which
      # failed CI twice for identical code. Cairo is self-hosted now; this keeps it that way.
      - name: Assert the build needs no network for assets
        run: node scripts/check-hermetic-build.mjs

      # 2026-10 follow-up: a non-JSON body was a 500 + a Sentry event on 12 routes.
      - name: Assert every route body tolerates malformed JSON
        run: node scripts/check-json-body-guard.mjs

      - name: Assert a production deploy cannot build without its required env
        run: node scripts/check-prod-env-gate.mjs

      # 2026-10-14 (architecture review, wave 5): ARCHITECTURE.md claimed "14 route handlers"
      # while 28 were on disk, and named a migrations file that does not exist. A document
      # that contradicts the code teaches the next reader to distrust all of it, so the route
      # table is checked against src/app/api instead of trusted.
      - name: Assert ARCHITECTURE.md matches the app
        run: node scripts/check-architecture-doc.mjs

      # Same review: the migrations directory holds two naming eras (the squashed baseline and
      # its 19 follow-ups use NNNN_, everything since 2026-10-06 is timestamped). Renaming the
      # applied ones would break the ledger↔repo correspondence Supabase keeps by version, so
      # the unification is forward-only and this is what keeps it that way.
      - name: Assert new migrations use the timestamp convention
        run: node scripts/check-migration-naming.mjs

      # supabase/migrations/ is not a staging area: the Supabase GitHub App applies what it
      # finds there to PRODUCTION on every push to master. This asserts every file in it was
      # approved by name (supabase/migrations/APPROVED.txt), so a draft reaches production only
      # after the owner said so — see supabase/pending/README.md for the flow.
      - name: Assert every migration in the applying directory was approved
        run: node scripts/check-migration-approval.mjs

      # Unit tests, BEFORE the build: a logic regression should fail in seconds
      # here rather than after a full Next build. `vitest run` exits non-zero on
      # a single failure, so there is no "expected failures" escape hatch here.
      # This suite is deliberately scoped to src/lib pure helpers — it never
      # touches the network, so it is safe on every push.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # 2026-10-16 (frontend audit F-1): the 315KB font sheet used to be a CSS import, i.e. a
      # render-blocking stylesheet in front of the first paint of every route (measured FCP
      # 3.27s on Slow-4G / 11.1-12.8s on Slow-3G). Re-importing it would be invisible to every
      # other gate — the build stays green and only a throttled browser notices — so the BUILT
      # css is inspected here, right after the build.
      - name: Assert the critical CSS carries no inlined font data
        run: node scripts/check-critical-css.mjs

      # The JS half of the same budget (frontend audit action item 18). Both real bundle
      # regressions in this repo's history — the font sheet in the critical path, and a QR encoder
      # imported statically into a route that only needs it on one tap — would have been caught by
      # a ceiling like this one.
      - name: Assert the JS/CSS bundle stays inside its budget
        run: node scripts/check-js-budget.mjs

      # The service-role key must never reach a client bundle. Cheap, and it
      # catches the single worst thing that could be committed.
      - name: Assert no service-role key in client assets
        run: |
          if grep -rl "ci-service-role-key-do-not-bundle" .next/static/ 2>/dev/null; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY found in client bundle"
            exit 1
          fi
          echo "ok — no service-role key in .next/static"

      - name: Assert security headers are configured
        run: |
          # The CSP moved from next.config.ts to src/proxy.ts (F-18): dynamic routes get a
          # per-request nonce, prerendered routes get the static policy. What CI can prove
          # from the build output is (a) the header rules here still carry the non-CSP
          # headers, (b) no CSP was left in the manifest — a second policy would be enforced
          # alongside the proxy's and the looser one would win — and (c) the proxy still
          # wires the policy in.
          node -e '
            const m = require("./.next/routes-manifest.json");
            const h = JSON.stringify(m.headers || "").toLowerCase();
            const need = ["strict-transport-security","x-content-type-options",
                          "x-frame-options","referrer-policy","permissions-policy"];
            const missing = need.filter(k => !h.includes(k));
            if (missing.length) { console.error("MISSING HEADERS:", missing); process.exit(1); }
            if (h.includes("content-security-policy")) {
              console.error("CSP is back in next.config.ts — it would be sent alongside the proxy policy (F-18)");
              process.exit(1);
            }
            // audit T1 #22: the obsolete header must not creep back. It reads as "XSS is handled"
            // while the real controls are the CSP and React escaping.
            if (h.includes("x-xss-protection")) {
              console.error("X-XSS-PROTECTION is back — obsolete, and it misrepresents the posture (audit T1 #22)");
              process.exit(1);
            }
            console.log("ok — header rules present, none deprecated, no duplicate CSP");
          '
          grep -q "from '@/lib/csp'" src/proxy.ts \
            || { echo '::error::proxy.ts no longer imports the CSP module'; exit 1; }
          node -e '
            // Next 16 (Turbopack) registers the proxy as a Node function, not in
            // middleware-manifest.json — the matcher lives here.
            const mf = require("./.next/server/functions-config-manifest.json");
            const entry = (mf.functions || {})["/_middleware"];
            if (!entry) { console.error("no /_middleware function in the build — the proxy was not compiled"); process.exit(1); }
            const source = (entry.matchers || []).map((m) => m.originalSource || m.regexp).join(" ");
            if (!source.includes("_next/static")) {
              console.error("proxy matcher does not look like the page catch-all: " + source);
              process.exit(1);
            }
            console.log("ok — proxy compiled and matches page routes");
          '

  e2e-readiness:
    name: E2E is configured (not executed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Proves the suite would still run if triggered, without touching production.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 for the same reason as the verify job — supabase-js needs
          # native WebSocket support, and helpers.ts creates the client at
          # module scope.
          node-version: 22
          cache: 'npm'
      - run: npm ci

      # e2e/helpers.ts reads .env.local at import time (module scope) and throws
      # on the missing keys — so even `playwright test --list` needs them. Same
      # placeholders as the build job; nothing real is exposed and no request is
      # ever made to a Supabase project.
      - name: Write env placeholders for module load
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://ci-supabase.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY=ci-service-role-key-do-not-bundle
          EOF

      - name: List Playwright specs
        # Must actually list tests: an env problem makes playwright exit with
        # "No tests found" and a non-zero code, which is exactly how the first
        # CI run failed. Assert the count so a silently-empty suite is caught.
        run: |
          npx playwright test --list | tee /tmp/specs.txt
          grep -qE "^Total: [1-9][0-9]* tests?" /tmp/specs.txt || {
            echo "::error::Playwright listed no tests — suite is broken or unconfigured"
            exit 1
          }
          grep -c "^  \[" /tmp/specs.txt | xargs -I{} echo "e2e specs discovered: {}"

      - name: Explain why e2e does not run here
        run: |
          echo "::notice::e2e/helpers.ts targets dokanstore.xyz (production) and"
          echo "creates real users/projects/orders. It is intentionally NOT run"
          echo "in CI to protect live merchant data. Run it manually:"
          echo "  npm run test:e2e"

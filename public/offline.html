<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF9F6" />
  <title>دكان — بدون اتصال</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: #FAF9F6;
      color: #1F2320;
      text-align: center;
      padding: 24px;
      direction: rtl;
    }
    .card {
      max-width: 360px;
      padding: 32px 24px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid rgba(20, 20, 15, 0.14);
    }
    .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #EEF0FF;
      color: #4F46E5;
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      color: #6B6F68;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .retry-btn {
      display: inline-block;
      min-height: 48px;
      padding: 10px 20px;
      background: #4F46E5;
      color: #fff;
      font-weight: 700;
      font-size: 0.8125rem;
      border-radius: 10px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .retry-btn:hover { background: #4338CA; }
    .retry-btn:focus-visible { outline: 3px solid rgba(79, 70, 229, 0.3); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">!</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من اتصال الشبكة ثم أعد المحاولة. الطلبات الجديدة لن تصل حتى يعود الاتصال.</p>
    <button class="retry-btn" onclick="window.location.reload()">أعد المحاولة</button>
  </div>
  <script>
    // Auto-retry when the browser comes back online
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
